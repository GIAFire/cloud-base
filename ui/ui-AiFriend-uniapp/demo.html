const pic=(p,w=650)=>`https://images.unsplash.com/${p.img}?auto=format&fit=crop&w=${w}&q=85`;const icons=['⌂','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 4H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h4l4 3v-3h8a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1Z"/><path d="M7 9h10M7 13h7"/></svg>','▷','♙'],navs=['首页','对话','视频','我的'];let page='首页',cat='为你推荐',tag='全部',query='',selected=0,favs=JSON.parse(localStorage.getItem('xinyu-favs')||'[]'),history={},callActive=false;const $=s=>document.querySelector(s);function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2300)}function vip(){$('#overlay').innerHTML='<div class="modal"><div class="dialog"><button class="close" onclick="closeModal()">✕</button><div class="content"><h2>织梦 Plus ✧</h2><p class="sub">让每一份在意，都被记住。</p><p class="sub">专属长期记忆 · 自定义陪伴风格 · 更多语音时光</p><button class="primary" onclick="closeModal();toast(\'已加入体验候补名单\')">预约体验</button><p class="sub" style="font-size:11px">原型展示，暂无付费或订阅。</p></div></div></div>'}function closeModal(){$('#overlay').innerHTML=''}function nav(){['desktopNav','mobileNav'].forEach(id=>$('#'+id).innerHTML=navs.map((n,i)=>`<button class="${page===n?'active':''}" onclick="go('${n}')"><i>${icons[i]}</i>${n}</button>`).join(''))}function go(p){page=p;nav();if(p==='首页')home();if(p==='对话')conversations();if(p==='视频')videos();if(p==='我的')profile();window.scrollTo(0,0)}function home(){$('#app').innerHTML=`<section class="hero"><img src="${pic(people[0],1200)}" alt="林晚"><div class="hero-copy"><div class="eyebrow">A CONNECTION THAT FEELS LIKE HOME</div><h1>每一种心动，<br>都值得被回应。</h1><p>遇见懂你的她，让陪伴有了专属的温度。</p><button class="primary" onclick="detail(0)">遇见今日心动 &nbsp; ↗</button></div><span class="hero-index">01 ━ 02</span></section><div class="sectionline"><div><h2>发现你的心动 <span style="color:var(--pink)">✧</span></h2><p>有趣的灵魂，正在等一个特别的你</p></div nction favorite(i){favs=favs.includes(i)?favs.filter(v=>v!==i):[...favs,i];localStorage.setItem('xinyu-favs',JSON.stringify(favs));cards()}function detail(i){selected=i;let p=people[i];$('#overlay').innerHTML=`<div class="modal"><div class="dialog"><button class="close" onclick="closeModal()" aria-label="关闭">✕</button><img src="${pic(p)}" alt="${p.name}"><div class="content"><h2 style="margin:0">${p.name} <small style="color:var(--pink);font-size:13px">${p.age}岁 · ${p.mbti}</small></h2><p class="sub">${p.intro}</p><div class="pills">${p.tags.map(t=>`<span>${t}</span>`).join('')}</div><button class="primary" onclick="closeModal();chat(${i})">♡ 开始我们的故事</button></div></div></div>`}function conversations(){$('#app').innerHTML=`<h1 class="page-title">对话</h1><p class="sub">那些只想说给她听的小事</p><div class="list">${people.slice(0,3).map((p,i)=>`<div class="row" role="button" tabindex="0" onclick="chat(${i})"><img src="${pic(p,150)}" alt="${p.name}"><div><h3>${p.name} <small style="color:#a6d8b3;font-size:10px">● 在线</small></h3><p>${history[i]?.length?'你们的故事还在继续…':p.quote}</p></div><time>刚刚 ›</time></div>`).join('')}</div><p class="hint">你的专属对话空间 · 点击角色继续聊天</p>`}function chat(i){selected=i;page='对话';nav();let p=people[i];if(!history[i])history[i]=[{text:p.quote,me:false}];$('#app').innerHTML=`<div class="sectionline" style="margin-bottom:20px"><button onclick="go('对话')">‹ &nbsp; ${p.name} <small style="color:var(--pink)">· 专属陪伴</small></button><button onclick="startCall(${i})">▷ 视频邀请</button></div><div class="chatbox"><div style="font-size:11px;color:#99859f;text-align:center">✧ AI 陪伴演示 · 她正在认真听你说</div><div class="messages" id="messages"></div><form class="composer" onsubmit="event.preventDefault();send()"><input id="message" placeholder="想和她说些什么…" autocomplete="off" aria-label="聊天内容"><button class="primary">发送 ↑</button></form></div><p class="hint">原型使用预设回复，尚未连接大模型与长期记忆。</p>`;renderMessages()}function renderMessages(){let box=$('#messages');box.innerHTML='';history[selected].forE function toggleClipPlayback(){const active=document.querySelector('.short-clip.is-active');if(!active)return;feedState.paused=!feedState.paused;active.classList.toggle('is-paused',feedState.paused);active.querySelector('.clip-toggle').setAttribute('aria-label',feedState.paused?'播放封面动效':'暂停封面动效')}
function likeClip(id,force=false){const clip=shortClips.find(c=>c.id===id);if(!clip)return;const liked=feedState.liked.includes(id);feedState.liked=force?(liked?feedState.liked:[...feedState.liked,id]):liked?feedState.liked.filter(x=>x!==id):[...feedState.liked,id];persistFeed();let card=document.querySelector(`[data-clip="${id}"]`),button=card?.querySelector('[data-action="like"]'),now=feedState.liked.includes(id);if(button){button.classList.toggle('is-liked',now);button.setAttribute('aria-pressed',String(now));button.querySelector('.action-count').textContent=feedCount(clip.likes+(now?1:0))}if(force&&card){let heart=document.createElement('span');heart.className='feed-like-burst';heart.textContent='♥';card.append(heart);setTimeout(()=>heart.remove(),750)}}
function saveClip(id){const clip=shortClips.find(c=>c.id===id);feedState.saved=feedState.saved.includes(id)?feedState.saved.filter(x=>x!==id):[...feedState.saved,id];persistFeed();const saved=feedState.saved.includes(id),button=document.querySelector(`[data-clip="${id}"] [data-action="save"]`);button.classList.toggle('is-saved',saved);button.setAttribute('aria-pressed',String(saved));button.querySelector('.action-count').textContent=feedCount(clip.saves+(saved?1:0));toast(saved?'已收藏这段心动':'已取消收藏')}
function followClip(person){const followed=feedState.followed.includes(person);feedState.followed=followed?feedState.followed.filter(x=>x!==person):[...feedState.followed,person];persistFeed();if(feedState.tab==='关注'&&followed){videos();return}document.querySelectorAll(`[data-person="${person}"]`).forEach(button=>{button.classList.toggle('followed',!followed);button.setAttribute('aria-pressed',String(!followed));button.setAttribute('aria-label',(followed?'关注':'取消关注')+people[person].name);button.querySelector('.follow-symbol').textContent=followed?'+':'✓'});toast(followed?'已取消关注':'已关注 '+people[person].name)}
function openClipComments(id){const clip=shortClips.find(c=>c.id===id);$('#overlay').innerHTML=`<div class="modal comments-modal"><section class="comments-sheet" role="dialog" aria-modal="true" aria-labelledby="commentsTitle"><div class="comments-head"><h3 id="commentsTitle">心动留言 · ${clipCommentCount(id)}</h3><button onclick="closeModal()" aria-label="关闭评论">✕</button></div><div class="comments-list" id="clipComments"></div><form class="comment-form" id="clipCommentForm"><input id="clipCommentInput" aria-label="写下评论" placeholder="把这一刻的心动写下来…" maxlength="200" required><button type="submit">发送 ↑</button></form><p class="comment-note">演示留言仅保留在本次页面会话中。</p></section></div>`;renderClipComments(id);$('#clipCommentForm').onsubmit=e=>{e.preventDefault();let v=$('#clipCommentInput').value.trim();if(!v)return;(feedState.comments[id]||=[]).push({name:'我',text:v,time:'刚刚'});$('#clipCommentInput').value='';renderClipComments(id);$('#commentsTitle').textContent='心动留言 · '+clipCommentCount(id);let count=document.querySelector(`[data-clip="${id}"] [data-action="comment"] .action-count`);if(count)count.textContent=clipCommentCount(id)};$('#overlay .modal').onclick=e=>{if(e.target===e.currentTarget)closeModal()}}
function renderClipComments(id){let rows=[{name:'路过的月亮',text:'好像真的被这一瞬间治愈了 ♡',time:'示例留言'},{name:'小岛来信',text:'今天也想听你说一句晚安。',time:'示例留言'},...(feedState.comments[id]||[])];let box=$('#clipComments');box.replaceChildren();rows.forEach(row=>{let outer=document.createElement('div');outer.className='comment-row';let avatar=document.createElement('div');avatar.className='comment-avatar';avatar.textContent=row.name==='我'?'屿':'♡';let body=document.createElement('div');body.className='comment-body';let name=document.createElement('b');name.textContent=row.name;let p=document.createElement('p');p.textContent=row.text;let small=document.createElement('small');small.textContent=row.time;body.append(name,p,small);outer.append(avatar,body);box.append(outer)});box.scrollTop=box.scrollHeight}
const beforeFeedGo=go;go=function(p){cleanupFeed();beforeFeedGo(p)};
const beforeFeedChat=chat;chat=function(i){cleanupFeed();beforeFeedChat(i)};
const beforeFeedCall=startCall;startCall=function(i){cleanupFeed();beforeFeedCall(i)};
const beforeFeedAuth=auth;auth=function(mode='login',email=''){cleanupFeed();beforeFeedAuth(mode,email)};
if(location.hash==='#video')go('视频');

</script></body></html>
